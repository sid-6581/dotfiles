promptToReturnFromSubprocess: false
os:
  # RVim has no built-in preset; configure its Vim-compatible commands explicitly.
  edit: 'rvim -- {{filename}}'
  editAtLine: 'rvim +{{line}} -- {{filename}}'
  editAtLineAndWait: 'rvim +{{line}} -- {{filename}}'
  openDirInEditor: 'rvim -- {{dir}}'
  editInTerminal: true
git:
  autoStageResolvedConflicts: false
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
gui:
  border: rounded
  theme:
    optionsTextColor:
      - "#b8bb26"
    inactiveBorderColor:
      - "#83a598"
    defaultFgColor:
      - "#ebdbb2"
    cherryPickedCommitFgColor:
      - "#b8bb26"
    cherryPickedCommitBgColor:
      - "#83a598"
    activeBorderColor:
      - "#fabd2f"
      - "bold"
    unstagedChangesColor:
      - "#fb4934"
    selectedLineBgColor:
      - "#665c54"
    searchingActiveBorderColor:
      - "bold"
  nerdFontsVersion: "3"
quitOnTopLevelReturn: true
